[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ascify-cli"
version = "1.0.0"
description = "Ascify-CLI - Chuyển đổi ảnh/video/webcam thành ASCII Art"
license = {text = "MIT"}
readme = "README.md"
authors = [
    {name = "Ascify Team"},
]
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "colorama>=0.4",
]

[project.optional-dependencies]
full = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
]
video = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/ascify-cli/ascify-cli"

[project.scripts]
ascify = "main:main"

[tool.setuptools.packages.find]
include = ["main", "config", "charset", "resize", "grayscale", "color",
           "unicode_mode", "converter", "video", "webcam", "exporter",
           "benchmark", "cli"]
